<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=contain, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="kondo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="こんど、どこ行こうか。旅の予定・予約・準備を共有できるアプリ。"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/kondo-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/kondo-apple-touch-icon-v12.png" />
    <title>kondo — こんど、どこ行こうか。</title>
    <script>
      try {
        var t = localStorage.getItem("tabi.theme");
        document.documentElement.dataset.theme =
          t === "dark" ||
          (t !== "light" && matchMedia("(prefers-color-scheme:dark)").matches)
            ? "dark"
            : "light";
      } catch {}
    </script>
    <!-- Inline so the first paint, including an offline launch, is the animation. -->
    <style>
      #initial-boot {
        --boot-ink: #000;
        --boot-edge-opacity: 1;
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        background: #fff;
        color: #171717;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      :root[data-theme="dark"] #initial-boot {
        --boot-ink: #fff;
        --boot-edge-opacity: 0;
        background: #000;
        color: #f3f3f3;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) #initial-boot {
          --boot-ink: #fff;
          --boot-edge-opacity: 0;
          background: #000;
          color: #f3f3f3;
        }
      }
      .boot-brand {
        display: grid;
        justify-items: center;
        gap: 22px;
      }
      .boot-symbol {
        color: var(--boot-ink);
        width: 176px;
        height: 104px;
        overflow: visible;
      }
      .boot-edge {
        opacity: var(--boot-edge-opacity);
      }
      .boot-stroke {
        --draw-delay: 240ms;
        --draw-duration: 620ms;
        --draw-ease: cubic-bezier(0.35, 0.05, 0.55, 0.95);
      }
      .boot-stroke-bottom {
        --draw-delay: 930ms;
        --draw-duration: 600ms;
      }
      .boot-dot {
        transform-box: fill-box;
        transform-origin: center;
        animation: boot-dot 280ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .boot-trace {
        stroke-linecap: round;
        stroke-dasharray: 1000;
        animation: boot-draw var(--draw-duration) var(--draw-ease)
          var(--draw-delay) both;
      }
      .boot-pen-tip {
        /* A zero-length round dash is a nib on the actual stroke geometry. */
        stroke-dasharray: 0 1000;
        animation:
          boot-write var(--draw-duration) var(--draw-ease) var(--draw-delay)
            both,
          boot-contact var(--draw-duration) linear var(--draw-delay) both;
      }
      .boot-pin {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: boot-pin 680ms 1600ms both;
      }
      .boot-name {
        display: flex;
        font-size: 28px;
        font-weight: 650;
        letter-spacing: 0.045em;
        line-height: 1;
      }
      .boot-name span {
        animation: boot-letter 320ms cubic-bezier(0.22, 1, 0.36, 1) both;
        animation-delay: calc(1800ms + var(--letter) * 60ms);
      }
      #initial-boot.boot-leaving {
        animation: boot-leave 240ms ease-out both;
      }
      @keyframes boot-dot {
        0% {
          opacity: 0;
          transform: scale(0.35);
        }
        75% {
          opacity: 1;
          transform: scale(1.08);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes boot-draw {
        0% {
          opacity: 0;
          stroke-dashoffset: 1000;
        }
        1% {
          opacity: 1;
        }
        100% {
          opacity: 1;
          stroke-dashoffset: 0;
        }
      }
      @keyframes boot-write {
        from {
          stroke-dashoffset: 1000;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes boot-contact {
        0%,
        100% {
          opacity: 0;
        }
        5%,
        92% {
          opacity: 1;
        }
      }
      @keyframes boot-pin {
        0% {
          opacity: 0;
          transform: translateY(-12px) scale(0.7) rotate(-10deg);
          animation-timing-function: ease-out;
        }
        34% {
          opacity: 1;
          transform: translateY(0) scale(1) rotate(9deg);
          animation-timing-function: ease-in-out;
        }
        60% {
          transform: rotate(-6deg);
          animation-timing-function: ease-in-out;
        }
        82% {
          transform: rotate(3deg);
          animation-timing-function: ease-in-out;
        }
        100% {
          opacity: 1;
          transform: rotate(0);
        }
      }
      @keyframes boot-letter {
        from {
          opacity: 0;
          transform: translateY(7px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes boot-leave {
        to {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-pen-tip {
          display: none;
        }
        #initial-boot,
        #initial-boot * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="initial-boot" role="status" aria-label="kondoを読み込み中">
      <div class="boot-brand" aria-hidden="true">
        <!-- Same geometry and theme treatment as public/logo.svg and logo-dark.svg.
             The ink tip and reveal mask follow the same curve and animation clock. -->
        <svg
          class="boot-symbol"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="96 274 812 480"
        >
          <defs>
            <path
              id="boot-upper"
              d="M393 425C500 399 577 381 620 410Q651 428 639 449"
            />
            <path
              id="boot-lower"
              d="M451 529C425 563 480 592 558 578Q613 569 648 553"
            />
            <path
              id="boot-marker"
              d="M705 490C686 490 672 504 672 522C672 538 686 553 705 577C724 553 738 538 738 522C738 504 724 490 705 490Z"
            />
            <mask
              id="boot-upper-mask"
              maskUnits="userSpaceOnUse"
              x="360"
              y="350"
              width="310"
              height="130"
            >
              <path
                class="boot-trace boot-stroke"
                d="M393 425C500 399 577 381 620 410Q651 428 639 449"
                pathLength="1000"
                fill="none"
                stroke="white"
                stroke-width="32"
              />
            </mask>
            <mask
              id="boot-lower-mask"
              maskUnits="userSpaceOnUse"
              x="410"
              y="500"
              width="270"
              height="110"
            >
              <path
                class="boot-trace boot-stroke boot-stroke-bottom"
                d="M451 529C425 563 480 592 558 578Q613 569 648 553"
                pathLength="1000"
                fill="none"
                stroke="white"
                stroke-width="32"
              />
            </mask>
          </defs>
          <g
            transform="translate(-596 -470) scale(2)"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <g mask="url(#boot-upper-mask)" fill="none">
              <use
                class="boot-edge"
                href="#boot-upper"
                stroke="white"
                stroke-width="26"
              />
              <use href="#boot-upper" stroke="currentColor" stroke-width="18" />
            </g>
            <g
              mask="url(#boot-lower-mask)"
              fill="none"
              stroke-dasharray="10 32"
            >
              <use
                class="boot-edge"
                href="#boot-lower"
                stroke="white"
                stroke-width="26"
              />
              <use href="#boot-lower" stroke="currentColor" stroke-width="18" />
            </g>
            <path
              class="boot-pen-tip boot-stroke"
              d="M393 425C500 399 577 381 620 410Q651 428 639 449"
              pathLength="1000"
              fill="none"
              stroke="currentColor"
              stroke-width="18"
            />
            <path
              class="boot-pen-tip boot-stroke boot-stroke-bottom"
              d="M451 529C425 563 480 592 558 578Q613 569 648 553"
              pathLength="1000"
              fill="none"
              stroke="currentColor"
              stroke-width="18"
            />
            <g class="boot-dot">
              <circle class="boot-edge" cx="393" cy="425" r="28" fill="white" />
              <circle cx="393" cy="425" r="24" fill="currentColor" />
            </g>
            <g class="boot-pin">
              <use
                class="boot-edge"
                href="#boot-marker"
                fill="white"
                stroke="white"
                stroke-width="22"
              />
              <use
                href="#boot-marker"
                fill="none"
                stroke="currentColor"
                stroke-width="14"
              />
              <circle
                cx="705"
                cy="522"
                r="10"
                fill="none"
                stroke="currentColor"
                stroke-width="12"
              />
            </g>
          </g>
        </svg>
        <strong class="boot-name"
          ><span style="--letter: 0">k</span><span style="--letter: 1">o</span
          ><span style="--letter: 2">n</span><span style="--letter: 3">d</span
          ><span style="--letter: 4">o</span></strong
        >
      </div>
    </div>
    <div id="root" inert></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
