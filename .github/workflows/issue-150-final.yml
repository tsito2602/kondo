name: Verify integrated detail release
on:
  push:
    branches: [feat/issue-150-detail-expansion]
permissions:
  contents: read
jobs:
  verify:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Synchronize release and remove temporary workflow
        run: |
          node <<'JS'
          const fs=require('node:fs');
          for(const file of ['package.json','package-lock.json']) {
            const data=JSON.parse(fs.readFileSync(file,'utf8')); data.version='1.8.0';
            if(data.packages)data.packages[''].version='1.8.0';
            fs.writeFileSync(file,JSON.stringify(data,null,2)+'\n');
          }
          const app=JSON.parse(fs.readFileSync('app.json','utf8')); app.expo.version='1.8.0'; fs.writeFileSync('app.json',JSON.stringify(app,null,2)+'\n');
          fs.unlinkSync('.github/workflows/issue-150-final.yml');
          JS
          git diff --check
      - run: npm ci > /tmp/detail-final-install.log 2>&1
      - name: Check final integrated application
        env:
          EXPO_PUBLIC_ENABLE_DEMO: 'true'
        run: |
          if npm run check > /tmp/detail-final-check.log 2>&1; then tail -n 16 /tmp/detail-final-check.log; else tail -n 100 /tmp/detail-final-check.log; exit 1; fi
      - name: Smoke test trip and detail transitions together
        run: |
          npm install --prefix /tmp/detail-browser --no-audit --no-fund playwright@1.56.1 > /tmp/detail-final-browser-install.log 2>&1
          /tmp/detail-browser/node_modules/.bin/playwright install --with-deps chromium webkit >> /tmp/detail-final-browser-install.log 2>&1
          cat > /tmp/detail-final-browser.cjs <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs'),path=require('node:path');
          const {createServer}=require('node:http'),{chromium,webkit}=require('playwright');
          const dist=path.resolve('dist');
          const server=createServer((req,res)=>{
            let file=path.join(dist,decodeURIComponent(new URL(req.url,'http://localhost').pathname));
            if(!file.startsWith(dist+'/')&&file!==dist){res.writeHead(400);res.end();return;}
            if(!fs.existsSync(file)||fs.statSync(file).isDirectory())file=fs.existsSync(file+'.html')?file+'.html':path.join(dist,'index.html');
            res.setHeader('Content-Type',({'.html':'text/html','.js':'text/javascript','.css':'text/css','.png':'image/png','.svg':'image/svg+xml','.woff2':'font/woff2','.json':'application/json'})[path.extname(file)]||'application/octet-stream');fs.createReadStream(file).pipe(res);
          });
          (async()=>{
            await new Promise(resolve=>server.listen(4173,'127.0.0.1',resolve));
            try{for(const [engine,launcher] of [['chromium',chromium],['webkit',webkit]]) {
              const browser=await launcher.launch();
              try{for(const width of [390,1440]) {
                const context=await browser.newContext({viewport:{width,height:844},serviceWorkers:'block'});
                const page=await context.newPage(),errors=[];page.setDefaultTimeout(10000);page.on('pageerror',e=>errors.push(e.message));
                try{
                  await page.goto('http://127.0.0.1:4173');
                  await page.getByRole('button',{name:'サンプルの旅行で試す',exact:true}).click();
                  await page.locator('[data-testid="trip-ticket"]:visible').first().click();
                  await page.getByTestId('itinerary-scroll').waitFor();
                  await page.waitForFunction(()=>!document.documentElement.hasAttribute('data-trip-transition'));
                  const title=page.getByTestId('detail-source-title').first();await title.scrollIntoViewIfNeeded();
                  const before=await page.getByTestId('itinerary-scroll').evaluate(e=>e.scrollTop);
                  await title.click();
                  const sheet=page.locator('[data-testid="form-sheet"]:visible').last();await sheet.waitFor();
                  await page.waitForTimeout(420);
                  assert.equal(await sheet.getAttribute('data-detail-motion'),'');
                  await sheet.getByRole('button',{name:'閉じる',exact:true}).click();
                  await page.locator('[data-testid="form-sheet"]:visible').waitFor({state:'hidden'});
                  assert(Math.abs(await page.getByTestId('itinerary-scroll').evaluate(e=>e.scrollTop)-before)<2);
                  if(width<600)await page.getByRole('button',{name:'旅行一覧へ戻る',exact:true}).click();
                  else await page.locator('a[href="/"]').filter({hasText:'すべての旅行'}).click();
                  await page.locator('[data-testid="trip-ticket"]:visible').first().waitFor();
                  await page.waitForFunction(()=>!document.documentElement.hasAttribute('data-trip-transition'));
                  assert.equal(await page.locator('.detail-motion-label').count(),0);
                  assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1));
                  assert.deepEqual(errors,[]);
                  console.log(`PASS ${engine}/${width}: trip open, detail expand/close, scroll and trip close; no overlay leaks`);
                }finally{await context.close();}
              }}finally{await browser.close();}
            }}finally{server.close();}
          })().catch(error=>{console.error(error);process.exitCode=1;});
          JS
          NODE_PATH=/tmp/detail-browser/node_modules node /tmp/detail-final-browser.cjs > /tmp/detail-final-browser.log 2>&1 || { cat /tmp/detail-final-browser.log; exit 1; }
          cat /tmp/detail-final-browser.log
      - name: Store verified tree without pushing a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          tree=[{'path':p,'mode':'100644','type':'blob','content':pathlib.Path(p).read_text()} for p in ['package.json','package-lock.json','app.json']]
          tree.append({'path':'.github/workflows/issue-150-final.yml','mode':'100644','type':'blob','sha':None})
          base=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          pathlib.Path('/tmp/detail-final-tree-input.json').write_text(json.dumps({'base_tree':base,'tree':tree}))
          PY
          gh api --method POST repos/$GITHUB_REPOSITORY/git/trees --input /tmp/detail-final-tree-input.json --jq '{sha: .sha}' > /tmp/detail-final-tree.json
          cat /tmp/detail-final-tree.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detail-integrated-release-verification
          retention-days: 3
          path: |
            /tmp/detail-final-check.log
            /tmp/detail-final-browser.log
            /tmp/detail-final-tree.json
