name: Detail float and return verification
on:
  push:
    branches: [feat/issue-150-detail-expansion]
    paths: [.github/workflows/issue-150-return-verify.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci > /tmp/return-install.log 2>&1 || { tail -50 /tmp/return-install.log; exit 1; }
      - name: Build demo-enabled browser variant
        env:
          EXPO_PUBLIC_ENABLE_DEMO: 'true'
        run: npm run build:web > /tmp/return-build.log 2>&1 || { tail -60 /tmp/return-build.log; exit 1; }
      - name: Verify interpolable return outline and floating content
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, textwrap
          original = subprocess.check_output(['git', 'show', '86a6d9dc16568b03900e4e2d388cb555b1653f8e:.github/workflows/issue-150-return-verify.yml'], text=True)
          block = original.split('      - name: Verify floating content and opaque inverse contraction\n        run: |\n', 1)[1].split('      - uses: actions/upload-artifact@v4', 1)[0]
          script = textwrap.dedent(block)
          before = "y:new DOMMatrixReadOnly(getComputedStyle(el).transform || 'none').m42"
          assert script.count(before) == 1
          script = script.replace(before, "clipPath:getComputedStyle(el).clipPath," + before)
          before = "assert.equal(returning.frames.length,3,'visible contraction then blend');"
          assert script.count(before) == 1
          script = script.replace(before, before + "\nassert(returning.frames[0].clipPath.startsWith('inset('),'settled surface retains an interpolable outline');\nconst clips=[];")
          before = "if(t<=350)assert.equal(+surface.opacity,1,'panel must stay visible during its return');"
          assert script.count(before) == 1
          script = script.replace(before, "if(t===120 || t===240)clips.push(parseFloat(surface.clipPath.slice(6)));\n" + before)
          before = "await finish();await hidden();\n                    assert(Math.abs"
          # Dedenting the workflow changes indentation, so use a stable token.
          before = "assert(Math.abs(await page.getByTestId('itinerary-scroll').evaluate(el=>el.scrollTop)-scrollY)<2,'scroll position retained');"
          assert script.count(before) == 1
          script = script.replace(before, "assert(clips[0]>0 && clips[1]>clips[0],'outline contracts continuously, without a discrete jump');\n" + before)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'return-check.sh').write_text(script)
          PY
          bash -e "$RUNNER_TEMP/return-check.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detail-float-return-verification
          path: |
            /tmp/return-browser.log
            /tmp/return-build.log
            /tmp/return-shots
          retention-days: 3
          if-no-files-found: ignore
