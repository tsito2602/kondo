name: Trip fade preview
on:
  push:
    branches: [feat/issue-145-trip-ticket-transition]
    paths: [.github/workflows/issue-145-fade-preview.yml, scripts/issue-145-fade-apply.py, scripts/issue-145-fade-browser.cjs]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare final scoped diff
        run: |
          python3 scripts/issue-145-fade-apply.py
          cp scripts/issue-145-fade-browser.cjs /tmp/tabi-fade-browser.cjs
          rm scripts/issue-145-fade-apply.py scripts/issue-145-fade-browser.cjs .github/workflows/issue-145-fade-preview.yml
          git diff --check
      - run: npm ci > /tmp/fade-install.log 2>&1
      - name: Check final application diff
        env:
          EXPO_PUBLIC_ENABLE_DEMO: 'true'
        run: |
          if npm run check > /tmp/fade-check.log 2>&1; then tail -n 5 /tmp/fade-check.log; else tail -n 90 /tmp/fade-check.log; exit 1; fi
      - name: Verify built browser opening and closing
        run: |
          npm install --prefix /tmp/fade-browser --no-audit --no-fund playwright@1.56.1 > /tmp/fade-browser-install.log 2>&1
          /tmp/fade-browser/node_modules/.bin/playwright install --with-deps chromium webkit >> /tmp/fade-browser-install.log 2>&1
          NODE_PATH="$GITHUB_WORKSPACE/node_modules:/tmp/fade-browser/node_modules" node /tmp/tabi-fade-browser.cjs > /tmp/fade-browser.log 2>&1 || { tail -n 70 /tmp/fade-browser.log; exit 1; }
          cat /tmp/fade-browser.log
      - name: Commit verified feature files only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'fix: fade trip foreground through opening and closing (#145)'
          git push origin HEAD:feat/issue-145-trip-ticket-transition
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trip-fade-verification
          retention-days: 3
          path: |
            /tmp/fade-check.log
            /tmp/fade-browser.log
            /tmp/fade-shots
