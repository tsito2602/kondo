name: Trip fade preview
on:
  push:
    branches: [feat/issue-145-trip-ticket-transition]
    paths: [.github/workflows/issue-145-fade-preview.yml]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bdbeb52b7244cdf1b55df7c526ffb23b28a305e2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci > /tmp/fade-install.log 2>&1
      - name: Build isolated demo preview
        env:
          EXPO_PUBLIC_ENABLE_DEMO: 'true'
        run: |
          if npm run build:web > /tmp/fade-build.log 2>&1; then tail -n 5 /tmp/fade-build.log; else tail -n 70 /tmp/fade-build.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: trip-fade-preview
          retention-days: 1
          path: |
            dist
            src/utils/trip-transition.web.ts
            src/trip-transitions.css
            scripts/test-trip-transition.mjs
