name: Utility sheet motion verification
on:
  push:
    branches: [feat/issue-150-detail-expansion]
    paths: [.github/workflows/issue-150-utility-motion.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare final application diff
        run: |
          python3 scripts/issue-150-sheet-apply.py
          rm scripts/issue-150-sheet-apply.py .github/workflows/issue-150-sheet-audit.yml .github/workflows/issue-150-utility-motion.yml
          git diff --check
          mkdir -p /tmp/utility-verification
          git diff --stat > /tmp/utility-verification/diff-stat.txt
      - run: npm ci > /tmp/utility-install.log 2>&1 || { tail -60 /tmp/utility-install.log; exit 1; }
      - name: Check final application and produce the demo-enabled browser build
        env:
          EXPO_PUBLIC_ENABLE_DEMO: 'true'
        run: npm run check > /tmp/utility-check.log 2>&1 || { tail -85 /tmp/utility-check.log; exit 1; }
      - name: Export candidate tree without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess, pathlib
          paths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          entries=[]
          for path in paths:
            p=pathlib.Path(path)
            entries.append(dict(path=path,mode='100644',type='blob',**({'content':p.read_text()} if p.exists() else {'sha':None})))
          base=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          pathlib.Path('/tmp/utility-tree.json').write_text(json.dumps(dict(base_tree=base,tree=entries)))
          source=[p for p in paths if pathlib.Path(p).is_file()]
          source += ['src/data/travel-provider.tsx']
          subprocess.run(['tar','-czf','/tmp/utility-verification/source.tgz',*source],check=True)
          PY
          gh api -X POST repos/${{ github.repository }}/git/trees --input /tmp/utility-tree.json --jq '{sha:.sha}' > /tmp/utility-verification/tree.json
          tar -czf /tmp/utility-verification/dist.tgz dist
          git diff -- src scripts > /tmp/utility-verification/final.patch
          git grep -nE 'demo|sample|SAMPLE|storageKey' -- src/data/travel-provider.tsx src/auth/auth-provider.tsx > /tmp/utility-verification/demo-paths.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: utility-sheet-verification
          path: |
            /tmp/utility-check.log
            /tmp/utility-verification
          retention-days: 2
          if-no-files-found: ignore
