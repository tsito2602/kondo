name: Prepare mobile width patch

on:
  push:
    branches: [fix/issue-139-mobile-page-width]
    paths: [.github/workflows/prepare-mobile-width.yml]

permissions:
  contents: write

jobs:
  lock-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare lock blob without changing dependencies or branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const text = readFileSync('package-lock.json', 'utf8');
          const expected = JSON.parse(text);
          assert.equal(expected.version, '1.6.1');
          assert.equal(expected.packages[''].version, '1.6.1');
          expected.version = '1.6.2';
          expected.packages[''].version = '1.6.2';
          const next = text.replace(/^(  "version": )"1\.6\.1"/m, '$1"1.6.2"').replace(/^(      "version": )"1\.6\.1"/m, '$1"1.6.2"');
          assert.deepEqual(JSON.parse(next), expected);
          const response = await fetch('https://api.github.com/repos/tsito2602/tabi/git/blobs', {
            method: 'POST',
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
            body: JSON.stringify({ content: next, encoding: 'utf-8' }),
          });
          if (!response.ok) throw new Error(`Lock blob creation failed: HTTP ${response.status}`);
          const { sha } = await response.json();
          assert.match(sha, /^[a-f0-9]{40}$/);
          console.log(`MOBILE_WIDTH_LOCK_BLOB=${sha}`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Prepared lock blob: ${sha}\nOnly the two root version fields changed to 1.6.2. No branch refs were updated.\n`);
          NODE
