name: Detail stagger browser verification
on:
  push:
    branches: [feat/issue-150-detail-expansion]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci > /tmp/stagger-browser-install.log 2>&1
      - name: Build the already checked application
        env:
          EXPO_PUBLIC_ENABLE_DEMO: 'true'
        run: |
          echo 'Reusing final application npm run check success from run 34835446339. No application changes in this verification commit.'
          npm run build:web > /tmp/stagger-browser-build.log 2>&1
      - name: Check real detail surfaces and interrupted reveals
        run: |
          npm install --prefix /tmp/stagger-browser --no-audit --no-fund playwright@1.56.1 > /tmp/stagger-browser-tools.log 2>&1
          /tmp/stagger-browser/node_modules/.bin/playwright install --with-deps chromium webkit >> /tmp/stagger-browser-tools.log 2>&1
          cat > /tmp/stagger-browser/check.cjs <<'JS'
          const assert = require('node:assert/strict'), fs = require('node:fs'), path = require('node:path');
          const { createServer } = require('node:http'), { chromium, webkit } = require('playwright');
          const dist = path.resolve('dist'), out = '/tmp/stagger-shots';fs.mkdirSync(out,{recursive:true});
          const server=createServer((req,res)=>{
            let file=path.join(dist,decodeURIComponent(new URL(req.url,'http://localhost').pathname));
            if(!file.startsWith(dist+'/')&&file!==dist){res.writeHead(400);res.end();return;}
            if(!fs.existsSync(file)||fs.statSync(file).isDirectory())file=fs.existsSync(file+'.html')?file+'.html':path.join(dist,'index.html');
            const mime={'.html':'text/html','.js':'text/javascript','.css':'text/css','.svg':'image/svg+xml','.png':'image/png','.json':'application/json','.woff2':'font/woff2'};
            res.setHeader('Content-Type',mime[path.extname(file)]||'application/octet-stream');fs.createReadStream(file).pipe(res);
          });
          (async()=>{
            await new Promise(resolve=>server.listen(4173,'127.0.0.1',resolve));
            try{for(const [engine,launcher] of [['chromium',chromium],['webkit',webkit]]){
              const browser=await launcher.launch();
              try{for(const [label,width,dark,reduced] of [['phone',390,false,false],['dark',390,true,false],['desktop',1440,false,false],['reduced',390,false,true]]){
                const context=await browser.newContext({viewport:{width,height:844},colorScheme:dark?'dark':'light',reducedMotion:reduced?'reduce':'no-preference',serviceWorkers:'block'});
                const page=await context.newPage(), errors=[];page.setDefaultTimeout(12000);page.on('pageerror',error=>errors.push(error.message));
                await page.addInitScript(()=>{
                  window.staggerRecords=[];window.freezeStagger=false;const original=Element.prototype.animate;
                  Element.prototype.animate=function(frames,options){const a=original.call(this,frames,options);
                    if(this.matches('[data-detail-motion]')||this.closest('[data-detail-motion]')){
                      window.staggerRecords.push({el:this,frames,options,a});if(window.freezeStagger){a.pause();a.currentTime=0;}
                    }return a;
                  };
                });
                const sheet=()=>page.locator('[data-testid="form-sheet"]:visible').last();
                const settle=()=>page.waitForTimeout(720);
                const close=async()=>{await sheet().getByRole('button',{name:'閉じる',exact:true}).click();await page.locator('[data-testid="form-sheet"]:visible').waitFor({state:'hidden'});await page.waitForTimeout(100);};
                const tab=async name=>{if(width>=1024)await page.getByRole('navigation').getByRole('link',{name,exact:true}).click();else await page.getByRole('tab',{name,exact:true}).click();await page.waitForTimeout(220);};
                const freeze=()=>page.evaluate(()=>{window.staggerRecords=[];window.freezeStagger=true;});
                const at=async t=>{await page.evaluate(t=>window.staggerRecords.forEach(({a})=>{a.pause();a.currentTime=t;}),t);await page.waitForTimeout(25);};
                const states=()=>page.evaluate(()=>window.staggerRecords.map(({el,frames,options})=>({target:el.dataset.testid||el.tagName,frames,options,opacity:getComputedStyle(el).opacity,transform:getComputedStyle(el).transform})));
                try{
                  await page.goto('http://127.0.0.1:4173');await page.getByRole('button',{name:'サンプルの旅行で試す',exact:true}).click();
                  await page.locator('[data-testid="trip-ticket"]:visible').first().click();await page.getByTestId('itinerary-scroll').waitFor();await page.waitForTimeout(500);
                  const booking=page.locator('[data-testid="detail-source-title"]:visible').first();await booking.scrollIntoViewIfNeeded();
                  const y=await page.getByTestId('itinerary-scroll').evaluate(el=>el.scrollTop);
                  if(!reduced)await freeze();await booking.click();await sheet().waitFor();
                  if(!reduced){
                    await page.waitForFunction(()=>window.staggerRecords.length>2);await at(0);const initial=await states();
                    assert.equal(initial[0].opacity,'1','the expanding surface stays opaque');
                    assert(initial.slice(1).every(x=>Number(x.opacity)===0&&x.options.delay>=280&&x.options.delay<=408),'all detail content waits for the surface');
                    assert.equal(await page.locator('.detail-motion-label').count(),0,'no title/time clones');
                    for(const t of [170,279,360,480,627]){
                      await at(t);const current=await states();
                      if(t===279)assert(current.slice(1).every(x=>Number(x.opacity)===0),'content is hidden until expansion is complete');
                      if(t===360)assert(Number(current[1].opacity)>0&&Number(current.at(-1).opacity)===0,'visible front of the stagger, pending tail');
                      if(label==='phone')await page.screenshot({path:path.join(out,`${engine}-${label}-${t}.png`)});
                    }
                    await at(700);assert((await states()).slice(1).every(x=>Number(x.opacity)===1));
                    await page.evaluate(()=>{window.freezeStagger=false;window.staggerRecords.forEach(({a})=>{try{a.finish();}catch{}});});
                  }
                  await settle();await close();assert(Math.abs(await page.getByTestId('itinerary-scroll').evaluate(el=>el.scrollTop)-y)<2,'list scroll remains unchanged');
                  await page.getByRole('button',{name:'予定を追加する',exact:true}).click();
                  await page.getByRole('textbox',{name:'予定名',exact:true}).fill('展示をめぐる');await page.getByRole('textbox',{name:'メモ',exact:true}).fill('入場券を確認してから展示を見る');
                  await sheet().getByRole('button',{name:'保存',exact:true}).click();await page.locator('[data-testid="form-sheet"]:visible').waitFor({state:'hidden'});
                  const plan=page.locator('[data-testid="detail-source-title"]:visible').filter({hasText:'展示をめぐる'}).first();await plan.scrollIntoViewIfNeeded();
                  if(!reduced)await freeze();await plan.click();await sheet().waitFor();
                  if(!reduced){
                    await page.waitForFunction(()=>window.staggerRecords.length>2);await at(350);const before=await states();
                    await page.evaluate(()=>{window.freezeStagger=false;});await close();const after=(await states()).slice(before.length);
                    assert(after.length>1&&after.every(x=>x.options.delay===0),'close does not wait for pending reveals');
                    assert.deepEqual(after.slice(1).map(x=>x.frames[0].opacity),before.slice(1).map(x=>x.opacity),'pending blocks never flash when closing');
                    await plan.click();
                  }
                  await settle();await page.screenshot({path:path.join(out,`${engine}-${label}-plan.png`)});
                  if(width<600&&!reduced){
                    const grip=await sheet().getByTestId('detail-dismiss-handle').boundingBox(),x=grip.x+grip.width/2,y=grip.y+grip.height/2;
                    await page.mouse.move(x,y);await page.mouse.down();await page.mouse.move(x,y+50,{steps:6});await page.mouse.move(x,y+2,{steps:8});await page.mouse.up();await page.waitForTimeout(220);assert(await sheet().isVisible());
                    await page.mouse.move(x,y);await page.mouse.down();await page.mouse.move(x,y+165,{steps:14});await page.mouse.up();await page.locator('[data-testid="form-sheet"]:visible').waitFor({state:'hidden'});await page.waitForTimeout(120);
                    assert(await plan.evaluate(el=>document.activeElement?.contains(el)),'focus returns to source');await plan.click();await settle();
                  }
                  await sheet().getByRole('button',{name:'編集',exact:true}).click();const input=page.getByRole('textbox',{name:'予定名',exact:true});await input.fill('未保存の編集');
                  await sheet().getByRole('button',{name:'閉じる',exact:true}).click();await page.getByRole('button',{name:'編集を続ける',exact:true}).click();assert.equal(await input.inputValue(),'未保存の編集');
                  await sheet().getByRole('button',{name:'閉じる',exact:true}).click();await page.getByRole('button',{name:'変更を破棄',exact:true}).click();await page.locator('[data-testid="form-sheet"]:visible').waitFor({state:'hidden'});
                  await tab('予約');await page.locator('[data-testid="booking-ticket"]:visible').first().click();await settle();await close();
                  await tab('行きたい場所');await page.getByRole('button',{name:'場所を追加',exact:true}).last().click();await page.getByRole('textbox',{name:'場所のタイトル',exact:true}).fill('静かな美術館');
                  await sheet().getByRole('button',{name:'保存',exact:true}).click();await settle();await close();
                  await page.locator('[data-testid="detail-source-title"]:visible').filter({hasText:'静かな美術館'}).first().click();await settle();await page.screenshot({path:path.join(out,`${engine}-${label}-place.png`)});await close();
                  assert.equal(await page.locator('.detail-motion-label,[data-detail-motion]').count(),0,'no stale layers');
                  assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),'viewport bounds');if(reduced)assert.equal(await page.evaluate(()=>window.staggerRecords.length),0);
                  assert.deepEqual(errors,[]);console.log(`PASS ${engine}/${label}: surface then staged sections, interrupted close, plan, booking, place, drag, editing and cleanup`);
                }catch(error){await page.screenshot({path:path.join(out,`${engine}-${label}-failure.png`)});fs.writeFileSync(path.join(out,'failure.json'),JSON.stringify({engine,label,error:String(error),records:await states()},null,2));throw error;}
                finally{await context.close();}
              }}finally{await browser.close();}
            }}finally{server.close();}
          })().catch(error=>{console.error(error);process.exitCode=1;});
          JS
          if node /tmp/stagger-browser/check.cjs > /tmp/stagger-browser-result.log 2>&1; then cat /tmp/stagger-browser-result.log; else tail -n 55 /tmp/stagger-browser-result.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detail-stagger-browser
          path: |
            /tmp/stagger-browser-result.log
            /tmp/stagger-shots
          retention-days: 3
