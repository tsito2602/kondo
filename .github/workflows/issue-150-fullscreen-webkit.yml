name: Fullscreen WebKit natural playback verification
on:
  push:
    branches: [feat/issue-150-detail-expansion]
    paths: [.github/workflows/issue-150-fullscreen-webkit.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bdf032013f871815f2607bcf556373dbb5de166a
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci > /tmp/fullscreen-install.log 2>&1 || { tail -50 /tmp/fullscreen-install.log; exit 1; }
      - name: Build the same application without changes
        env:
          EXPO_PUBLIC_ENABLE_DEMO: 'true'
        run: npm run build:web > /tmp/fullscreen-build.log 2>&1 || { tail -60 /tmp/fullscreen-build.log; exit 1; }
      - name: Observe natural WebKit playback rather than forcing animations to finish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/issue-150-fullscreen-check.yml').read_text()
          block=text.split('      - name: Verify layouts, keyboard viewport and preserved transitions\n        run: |\n',1)[1].split('      - uses: actions/upload-artifact@v4',1)[0]
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          old="async function settle(){await page.waitForTimeout(60);await page.evaluate(()=>document.getAnimations().forEach(a=>{const t=a.effect?.getComputedTiming();if(t&&Number.isFinite(t.endTime)&&t.endTime<5000)try{a.finish();}catch{}}));await page.waitForTimeout(60);}"
          assert script.count(old)==1
          script=script.replace(old,"async function settle(){await page.waitForTimeout(1450);}")
          script=script.replace("[['chromium',chromium],['webkit',webkit]]","[['webkit',webkit]]")
          script=script.replace("[['phone',390,false,false],['dark',390,true,false],['desktop',1440,false,false],['reduced',390,false,true]]","[['phone',390,false,false],['desktop',1440,false,false],['reduced',390,false,true]]")
          script=script.replace('install --with-deps chromium webkit','install --with-deps webkit')
          Path('/tmp/fullscreen-natural-check.sh').write_text(script)
          PY
          bash -e /tmp/fullscreen-natural-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fullscreen-webkit-verification
          path: |
            /tmp/fullscreen-browser.log
            /tmp/fullscreen-build.log
            /tmp/fullscreen-shots
          retention-days: 3
          if-no-files-found: ignore
