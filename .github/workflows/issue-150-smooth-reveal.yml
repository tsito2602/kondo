name: Detail smooth reveal verification
on:
  push:
    branches: [feat/issue-150-detail-expansion]
    paths: [.github/workflows/issue-150-smooth-reveal.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci > /tmp/smooth-install.log 2>&1 || { tail -60 /tmp/smooth-install.log; exit 1; }
      - name: Build unchanged application for browser verification
        env:
          EXPO_PUBLIC_ENABLE_DEMO: 'true'
        run: npm run build:web > /tmp/smooth-build.log 2>&1 || { tail -60 /tmp/smooth-build.log; exit 1; }
      - name: Run focused checks with persistent test identity
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          original = subprocess.check_output(['git', 'show', '92049ffa5df1b82204a5e3e8ad6439e6266801de:.github/workflows/issue-150-smooth-reveal.yml'], text=True)
          block = original.split('      - name: Verify ordered easing, early close and reduced motion\n        run: |\n', 1)[1].split('      - uses: actions/upload-artifact@v4', 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          # Runtime flags are intentionally cleared on disposal. Test identity
          # must survive cleanup when inspecting the completed exit keyframes.
          before = "surface: el.hasAttribute('data-detail-motion')"
          assert script.count(before) == 1
          script = script.replace(before, "surface: el.dataset.testid === 'form-sheet'")
          pathlib.Path(os.environ['RUNNER_TEMP'], 'smooth-check.sh').write_text(script)
          PY
          bash -e "$RUNNER_TEMP/smooth-check.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detail-smooth-reveal-verification
          path: |
            /tmp/smooth-browser.log
            /tmp/smooth-build.log
            /tmp/smooth-shots
          retention-days: 3
          if-no-files-found: ignore
