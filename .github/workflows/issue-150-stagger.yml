name: Detail staged reveal verification
on:
  push:
    branches: [feat/issue-150-detail-expansion]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare only the requested detail reveal change
        run: |
          node <<'JS'
          const fs = require('node:fs');
          function edit(path, change) { const before = fs.readFileSync(path, 'utf8'); const after = change(before); if (before === after) throw new Error(`No change: ${path}`); fs.writeFileSync(path, after); }
          function replace(s, from, to) { if (s.split(from).length !== 2) throw new Error(`Expected one match: ${from.slice(0, 100)}`); return s.replace(from, to); }
          function cut(s, from, to) { const a = s.indexOf(from), b = s.indexOf(to, a); if (a < 0 || b < 0) throw new Error(`Missing section: ${from}`); return s.slice(0, a) + s.slice(b); }
          edit('src/utils/detail-origin.ts', s => s.replace(/^export type DetailLabel = .*\n/m, '').replace('; labels: DetailLabel[]', ''));
          edit('src/utils/detail-origin.web.ts', () => `import type { DetailOrigin, DetailRect } from './detail-origin';
          export type { DetailOrigin } from './detail-origin';
          
          export function detailRect(element: Element): DetailRect {
            const { left, top, width, height } = element.getBoundingClientRect();
            return { left, top, width, height };
          }
          // The surface carries the relationship; content is revealed in its final layout.
          export function captureDetailOrigin(event: { currentTarget?: unknown }): DetailOrigin | undefined {
            const element = event.currentTarget;
            if (!(element instanceof HTMLElement)) return;
            const rect = detailRect(element);
            if (!rect.width || !rect.height) return;
            return { element, rect, radius: parseFloat(getComputedStyle(element).borderTopLeftRadius) || 12 };
          }
          `);
          edit('src/detail-motion.css', s => cut(s, '.detail-motion-label {', '[data-testid="detail-dismiss-handle"]'));
          edit('src/components/booking-sheet.tsx', s => replace(s, '<View style={styles.detailTicket}>', '<View testID="booking-details-summary" style={styles.detailTicket}>'));
          edit('src/utils/detail-motion.web.ts', s => {
            s = replace(s, 'detailRect, labelStyle', 'detailRect');
            s = replace(s, 'let animations: Animation[] = [], labels: HTMLElement[] = [], restoreLabels: (() => void)[] = [];', 'let animations: Animation[] = [];');
            s = cut(s, '  const removeLabels = () => {', '  const cancel = () => {');
            s = replace(s, '    removeLabels();\n', '');
            s = cut(s, '  const sharedLabels = (opening: boolean, duration: number) => {', '  const settle = () => {');
            s = replace(s, '/** Owns one mounted detail surface.', `// Animate semantic sections, not every nested label. Both an ancestor and its
          // descendants must never fade, translate or accumulate delays together.
          export function detailContentBlocks(content: HTMLElement): HTMLElement[] {
            const header = content.querySelector<HTMLElement>('[data-testid="sheet-header"]');
            const scroll = content.querySelector<HTMLElement>('[data-testid="form-sheet-scroll"]');
            const container = scroll?.firstElementChild;
            const wrappers = '[data-testid="place-details"], [data-testid="itinerary-item-details"], [data-testid="booking-details-summary"]';
            const sections = Array.from(container?.children ?? []).flatMap((element) =>
              element.matches(wrappers) ? Array.from(element.children) : [element]);
            const win = content.ownerDocument.defaultView!;
            const blocks = [header, ...sections].filter((element): element is HTMLElement =>
              element instanceof win.HTMLElement && element.getClientRects().length > 0
              && win.getComputedStyle(element).display !== 'none');
            return blocks.length ? blocks : [content];
          }
          
          /** Owns one mounted detail surface.`);
            s = replace(s, '    const interrupted = animations.length > 0 || Boolean(surface.style.transform);\n', '');
            s = replace(s, "    const contentOpacity = content ? win.getComputedStyle(content).opacity : '1';", `    const blocks = content ? detailContentBlocks(content) : [];
              // Capture each block before cancellation so a close during the reveal
              // cannot briefly expose blocks that have not appeared yet.
              const states = blocks.map((element) => {
                const css = win.getComputedStyle(element);
                return { opacity: css.opacity, transform: css.transform };
              });`);
            s = replace(s, '    const duration = open ? 360 : 260;', '    const duration = open ? 280 : 240;');
            s = replace(s, `      // Measure labels before transforming their ancestor. The real content is
                // faded separately, preventing stretched glyphs and a final-frame pop.
                if (!interrupted) sharedLabels(open, duration);`, `      // The opaque surface arrives first. No detached title/time copies fly
                // across the screen; all content appears where it will be read.`);
            s = replace(s, "      if (content) play(content, open ? [{ opacity: first ? 0 : contentOpacity }, { opacity: 1 }] : [{ opacity: contentOpacity }, { opacity: 0 }], open ? 230 : 150, open && first ? 90 : 0);", `      blocks.forEach((element, index) => {
                  const from = open && first ? { opacity: '0', transform: 'translate3d(0px, 10px, 0px)' } : states[index];
                  const to = open ? { opacity: '1', transform: 'translate3d(0px, 0px, 0px)' } : { opacity: '0', transform: 'translate3d(0px, 6px, 0px)' };
                  // Bound the tail even for many sections. Closing/reopening never
                  // waits for the entrance sequence to finish.
                  play(element, [from, to], open ? 220 : 120, open && first ? duration + Math.min(index, 4) * 32 : 0);
                });`);
            s = replace(s, '  const resize = () => settle();', `  const resize = () => settle();
            const keydown = (event: KeyboardEvent) => {
              if (event.key === 'Tab' && isOpen && animations.length) settle();
            };
            surface.addEventListener('keydown', keydown);`);
            s = replace(s, "win.removeEventListener('resize', resize);", "surface.removeEventListener('keydown', keydown); win.removeEventListener('resize', resize);");
            return s;
          });
          edit('scripts/test-detail-motion.mjs', s => {
            s = replace(s, 'const { createDetailMotion, detailPose }', 'const { createDetailMotion, detailPose, detailContentBlocks }');
            s = replace(s, '<h2 data-testid="detail-target-title">美術館</h2><span data-testid="detail-target-time">10:00</span>', '<header data-testid="sheet-header">予定の詳細</header><div data-testid="form-sheet-scroll"><div><div data-testid="itinerary-item-details"><h2 data-testid="detail-target-title">美術館</h2><span data-testid="detail-target-time">10:00</span><section id="note"><p>メモ</p><p>展示を見る</p></section></div></div></div>');
            s = replace(s, "  assert.equal(f.doc.querySelectorAll('.detail-motion-label').length, 2);", `  assert.equal(f.doc.querySelectorAll('.detail-motion-label').length, 0, 'no detached title or time is created');
            const surfaceAnimation = f.records.find(record => record.element === f.surface);
            const sections = f.records.filter(record => record.element !== f.surface);
            assert.equal(sections.length, 4, 'header, title, time and note are semantic blocks');
            assert(sections.every(record => record.options.delay >= surfaceAnimation.options.duration), 'content waits for the surface');
            assert(sections.every(record => record.frames[0].opacity === '0' && record.frames[0].transform.includes('10px')), 'all contents rise from below');
            assert(sections.every(record => record.options.fill === 'both'), 'pending blocks do not flash before their delay');
            assert(sections[1].options.delay < sections[2].options.delay);
            assert(!sections.some(record => record.element.tagName === 'P'), 'nested paragraphs do not animate twice');`);
            s = replace(s, "f.records.at(-2).frames.at(-1).transform", "f.records.filter(record => record.element === f.surface).at(-1).frames.at(-1).transform");
            s = replace(s, "assert.equal(f.doc.querySelectorAll('.detail-motion-label').length, 1, 'only semantically equal information is shared');", "assert.equal(f.doc.querySelectorAll('.detail-motion-label').length, 0, 'text matching no longer controls the animation');");
            s = s.replace("console.log('Detail motion:", `{
            const f = fixture();
            const body = f.doc.querySelector('[data-testid="itinerary-item-details"]');
            for (let i = 0; i < 30; i++) { const section = f.doc.createElement('section'); section.textContent = String(i); body.append(section); }
            f.motion.setOpen(true, false, () => {});
            assert.equal(detailContentBlocks(f.doc.querySelector('[data-testid="form-sheet-fill"]')).length, 34);
            const blocks = f.records.filter(record => record.element !== f.surface);
            assert(Math.max(...blocks.map(record => record.options.delay)) <= 408, 'a long detail cannot queue seconds of delay');
            assert.equal(f.doc.querySelector('h2').style.visibility, '');
            f.motion.suspend(); await f.finish();
            assert.equal(f.surface.hasAttribute('data-detail-motion'), false);
            f.close();
          }
          {
            const f = fixture(); let closed = 0;
            f.motion.setOpen(true, false, () => {});
            const at = f.records.length;
            f.motion.setOpen(false, false, () => closed++);
            assert(f.records.slice(at).every(record => record.options.delay === 0), 'closing interrupts pending section reveals immediately');
            await f.finish(); assert.equal(closed, 1); f.close();
          }
          {
            const f = fixture(); f.motion.setOpen(true, false, () => {});
            f.surface.dispatchEvent(new f.dom.window.KeyboardEvent('keydown', { key: 'Tab', bubbles: true }));
            await f.finish();
            assert.equal(f.doc.querySelector('h2').style.visibility, '', 'keyboard navigation exposes all content without waiting');
            f.close();
          }
          console.log('Detail motion:`);
            return s.replace('matching labels, completion', 'staged sections without shared labels, bounded delay, completion');
          });
          fs.unlinkSync('.github/workflows/issue-150-stagger.yml');
          JS
          git diff --check
      - run: npm ci > /tmp/stagger-install.log 2>&1
      - name: Check the final application diff
        env:
          EXPO_PUBLIC_ENABLE_DEMO: 'true'
        run: |
          if npm run check > /tmp/stagger-check.log 2>&1; then tail -n 12 /tmp/stagger-check.log; else tail -n 70 /tmp/stagger-check.log; exit 1; fi
      - name: Export the tested tree without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/stagger-export
          git diff > /tmp/stagger-export/final.patch
          cp /tmp/stagger-check.log /tmp/stagger-export/check.log
          node <<'JS'
          const fs = require('node:fs'), { execFileSync: exec } = require('node:child_process');
          const paths = exec('git', ['diff', '--name-only', 'HEAD'], { encoding: 'utf8' }).trim().split('\n');
          const tree = paths.map(path => ({ path, mode: '100644', type: 'blob', ...(fs.existsSync(path) ? { content: fs.readFileSync(path, 'utf8') } : { sha: null }) }));
          const result = exec('gh', ['api', '--method', 'POST', 'repos/tsito2602/tabi/git/trees', '--input', '-'], { input: JSON.stringify({ base_tree: exec('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim(), tree }), encoding: 'utf8' });
          fs.writeFileSync('/tmp/stagger-export/tree.json', result);
          for (const path of paths.filter(path => fs.existsSync(path))) { const dest = '/tmp/stagger-export/' + path; fs.mkdirSync(require('node:path').dirname(dest), { recursive: true }); fs.copyFileSync(path, dest); }
          JS
          cp -R dist /tmp/stagger-export/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detail-stagger-verification
          path: |
            /tmp/stagger-export
            /tmp/stagger-check.log
          retention-days: 3
