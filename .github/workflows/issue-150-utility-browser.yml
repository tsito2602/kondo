name: Utility sheet browser verification
on:
  push:
    branches: [feat/issue-150-detail-expansion]
    paths: [.github/workflows/issue-150-utility-browser.yml]
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b6b451444fe077ea730b5b7e8991a8e1cc2a2590
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: utility-sheet-verification
          run-id: 34845428679
          github-token: ${{ github.token }}
          path: /tmp/utility-build
      - name: Reuse checked application and verify complete utility flows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/issue-150-utility-browser.yml').read_text()
          before=text.split('      - name: Reuse immutable checked build and install isolated browser tools\n        run: |\n',1)[1].split('      - name: Exercise action sheets, nested picker, editing and notes',1)[0]
          body=text.split('      - name: Exercise action sheets, nested picker, editing and notes\n        run: |\n',1)[1].split('      - uses: actions/upload-artifact@v4',1)[0]
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in (before+body).splitlines())
          for label in ['しおりへ','しおりを見る','旅行を編集','旅行を削除']:
            a="name:'"+label+"',exact:true"
            assert a in script,a
            script=script.replace(a,'name:/'+label+'/')
          assert '{name,exact:true}' in script
          script=script.replace('{name,exact:true}',"{name:new RegExp(name+'$')}")
          script=script.replace("const root=path.resolve('dist'), out='/tmp/utility-shots';", "let failures=0; const root=path.resolve('dist'), out='/tmp/utility-shots';")
          script=script.replace("path.join(out,'failure.json')", "path.join(out,`${engine}-${label}-failure.json`)")
          script=script.replace("throw e;}finally{await context.close();}", "failures++;console.error(`FAIL ${engine}/${label}`,e);}finally{await context.close();}")
          script=script.replace("})().catch(e=>", "assert.equal(failures,0,'all representative sheet flows must pass');\n})().catch(e=>")
          Path('/tmp/utility-browser-check.sh').write_text(script)
          PY
          bash -e /tmp/utility-browser-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: utility-sheet-browser
          path: |
            /tmp/utility-browser.log
            /tmp/utility-shots
          retention-days: 3
          if-no-files-found: ignore
