name: Utility sheet browser verification
on:
  push:
    branches: [feat/issue-150-detail-expansion]
    paths: [.github/workflows/issue-150-utility-browser.yml]
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: utility-sheet-verification
          run-id: 34845428679
          github-token: ${{ github.token }}
          path: /tmp/utility-build
      - name: Reuse immutable checked build and install isolated browser tools
        run: |
          tar -xzf /tmp/utility-build/utility-verification/dist.tgz
          npm install --prefix "$RUNNER_TEMP/utility-browser" --no-audit --no-fund playwright > /tmp/utility-browser-install.log 2>&1
          "$RUNNER_TEMP/utility-browser/node_modules/.bin/playwright" install --with-deps chromium webkit >> /tmp/utility-browser-install.log 2>&1
      - name: Exercise action sheets, nested picker, editing and notes
        run: |
          mkdir -p /tmp/utility-shots
          cat > "$RUNNER_TEMP/utility-browser/check.cjs" <<'JS'
          const assert=require('node:assert/strict'), fs=require('node:fs'), path=require('node:path');
          const {createServer}=require('node:http'), {chromium,webkit}=require('playwright');
          const root=path.resolve('dist'), out='/tmp/utility-shots';
          const server=createServer((req,res)=>{
            let file=path.join(root,decodeURIComponent(new URL(req.url,'http://localhost').pathname));
            if(file!==root&&!file.startsWith(root+'/')) {res.writeHead(400);res.end();return;}
            if(!fs.existsSync(file)||fs.statSync(file).isDirectory()) file=fs.existsSync(file+'.html')?file+'.html':path.join(root,'index.html');
            res.setHeader('Content-Type',({'.html':'text/html','.js':'text/javascript','.css':'text/css','.json':'application/json','.png':'image/png','.svg':'image/svg+xml','.woff2':'font/woff2','.ttf':'font/ttf'})[path.extname(file)]||'application/octet-stream');fs.createReadStream(file).pipe(res);
          });
          (async()=>{
            await new Promise(r=>server.listen(4173,'127.0.0.1',r));
            for(const [engine,launch] of [['chromium',chromium],['webkit',webkit]]){
              const browser=await launch.launch();
              try{for(const [label,width,dark,reduced] of engine==='chromium'?[['phone',390,false,false],['desktop',1440,false,false],['dark',390,true,false]]:[['phone',390,false,false],['desktop',1440,false,false],['reduced',390,false,true]]){
                const context=await browser.newContext({viewport:{width,height:900},colorScheme:dark?'dark':'light',reducedMotion:reduced?'reduce':'no-preference',serviceWorkers:'block'});
                const page=await context.newPage(), errors=[], evidence=[];page.setDefaultTimeout(12000);page.on('pageerror',e=>errors.push(e.message));
                await page.addInitScript(()=>{window.utilityRecords=[];window.holdUtility=false;const animate=Element.prototype.animate;Element.prototype.animate=function(frames,options){const a=animate.call(this,frames,options);if(this.matches('[data-detail-motion]')||this.closest('[data-detail-motion]')){window.utilityRecords.push({el:this,a,frames,options});if(window.holdUtility){a.pause();a.currentTime=0;}}return a;};});
                const sheet=()=>page.locator('[data-testid="form-sheet"]:visible,[data-testid="picker-sheet"]:visible,[data-testid="note-editor"]:visible').last();
                const nav=async name=>{await page.getByRole(width>=1024?'link':'tab',{name,exact:true}).click();await page.waitForTimeout(400);};
                const reset=()=>page.evaluate(()=>{window.utilityRecords=[];window.holdUtility=true;});
                const at=async t=>{await page.evaluate(t=>window.utilityRecords.forEach(({a})=>{if(a.playState!=='idle'){a.pause();a.currentTime=t;}}),t);await page.waitForTimeout(30);};
                const data=()=>page.evaluate(()=>window.utilityRecords.map(({el,frames,options})=>({surface:['form-sheet','picker-sheet','note-editor'].includes(el.dataset.testid),text:el.textContent.slice(0,30),frames,options,opacity:getComputedStyle(el).opacity,transform:getComputedStyle(el).transform,clip:getComputedStyle(el).clipPath})));
                const finish=async()=>{await page.evaluate(()=>{window.holdUtility=false;window.utilityRecords.forEach(({a})=>{if(a.playState!=='idle')try{a.finish();}catch{}});});await page.waitForTimeout(100);};
                async function opening(trigger,name,morph=true){
                  await trigger.scrollIntoViewIfNeeded();await page.waitForTimeout(100);if(!reduced)await reset();await trigger.click();await sheet().waitFor();
                  if(!reduced){await page.waitForFunction(()=>window.utilityRecords.length>2);await at(0);const initial=await data(),surface=initial.find(x=>x.surface),moves=initial.filter(x=>!x.surface&&x.frames[0].transform);
                    assert(surface);assert(moves.length>1,'individual content groups exist');assert(moves.every(x=>Number(x.opacity)===0),'content begins hidden');assert.equal(new Set(moves.map(x=>x.options.delay)).size,moves.length,'ordered entrance');
                    if(morph)assert(surface.frames[0].clipPath!=='inset(0px)','launching item is the expansion origin');
                    await at(460);const middle=await data();assert(middle.some(x=>!x.surface&&Number(x.opacity)>0&&Number(x.opacity)<1),'soft intermediate opacity');evidence.push({name,initial,middle});
                    if(label==='phone')await page.screenshot({path:path.join(out,`${engine}-${name}-opening.png`)});await finish();
                  }else await page.waitForTimeout(100);
                }
                async function closing(action,name,morph=true){
                  const element=await sheet().elementHandle();if(!reduced)await reset();await action();
                  if(!reduced){await page.waitForFunction(()=>window.utilityRecords.some(r=>['form-sheet','picker-sheet','note-editor'].includes(r.el.dataset.testid)));const records=await data(),surface=records.find(x=>x.surface);
                    if(morph){assert.equal(surface.frames.length,3,'reverse contraction has a final blend');await at(220);assert.equal((await data()).find(x=>x.surface).opacity,'1','paper stays opaque while returning');}
                    evidence.push({name,close:records});if(label==='phone')await page.screenshot({path:path.join(out,`${engine}-${name}-closing.png`)});await finish();
                  }
                  await page.waitForFunction(el=>!el.isConnected,element);await page.waitForTimeout(100);
                }
                try{
                  await page.goto('http://127.0.0.1:4173');await page.getByRole('button',{name:'サンプルの旅行で試す',exact:true}).click();await page.locator('[data-testid="trip-ticket"]:visible').first().click();await page.getByTestId('itinerary-scroll').waitFor();await page.waitForTimeout(600);
                  await nav('行きたい場所');
                  const card=()=>page.getByTestId('place-card').filter({hasText:'旧市街でカフェ巡り'});
                  const scrollY=await page.getByTestId('places-scroll').evaluate(el=>el.scrollTop);
                  await opening(card().getByRole('button',{name:'旧市街でカフェ巡りのステータスを変更',exact:true}),'status');
                  await closing(()=>sheet().locator('[data-testid="form-sheet-scroll"] [role="button"]').first().click(),'status');
                  assert(Math.abs(await page.getByTestId('places-scroll').evaluate(el=>el.scrollTop)-scrollY)<2);
                  await opening(card().getByRole('button',{name:'しおりへ',exact:true}),'planning');
                  await opening(sheet().getByRole('button',{name:/^日付 /}),'date-picker');
                  await closing(()=>sheet().getByText('決定',{exact:true}).click(),'date-picker');
                  assert(await sheet().getByText('しおりに追加',{exact:true}).isVisible(),'underlying planner is retained');
                  await closing(()=>sheet().getByRole('button',{name:'追加',exact:true}).click(),'planning');
                  assert(await card().getByRole('button',{name:'しおりを見る',exact:true}).isVisible());
                  await nav('予約');
                  await opening(page.getByRole('button',{name:'サンプル航空 101の乗り継ぎを変更',exact:true}),'connection');
                  const prior=await page.evaluate(()=>window.utilityRecords.length);await sheet().getByRole('radio').last().click();await page.waitForTimeout(100);assert.equal(await page.evaluate(()=>window.utilityRecords.length),prior,'option changes do not replay entrance');await sheet().getByRole('radio').first().click();
                  await closing(()=>sheet().getByRole('button',{name:'保存',exact:true}).click(),'connection');
                  // Forms remain editable and the discard confirmation preserves drafts.
                  await page.getByRole('button',{name:'旅行メニュー',exact:true}).click();await page.waitForTimeout(400);
                  await opening(page.getByTestId('trip-menu').getByRole('button',{name:'旅行を編集',exact:true}),'trip-form',false);
                  const field=sheet().getByRole('textbox').first();await field.fill('Utility draft');await sheet().getByRole('button',{name:'閉じる',exact:true}).click();await page.getByTestId('discard-dialog').getByRole('button',{name:'編集を続ける',exact:true}).click();await page.getByTestId('discard-dialog').waitFor({state:'hidden'});assert.equal(await field.inputValue(),'Utility draft');
                  await sheet().getByRole('button',{name:'閉じる',exact:true}).click();await page.getByTestId('discard-dialog').getByRole('button',{name:'変更を破棄',exact:true}).click();await page.locator('[data-testid="form-sheet"]:visible').waitFor({state:'hidden'});await page.waitForTimeout(150);
                  await nav('メモ');await page.getByRole('button',{name:'メモを書く',exact:true}).last().click();await page.getByTestId('note-body').fill('Utility memo\nSaved during animation checks');await sheet().getByRole('button',{name:'完了',exact:true}).click();await page.getByTestId('note-editor').waitFor({state:'hidden'});await page.waitForTimeout(200);
                  await opening(page.getByRole('button',{name:'Utility memoを開く',exact:true}),'note');assert((await page.getByTestId('note-body').inputValue()).includes('Saved during'));
                  await closing(()=>sheet().getByRole('button',{name:'完了',exact:true}).click(),'note');
                  await page.getByRole('button',{name:'旅行メニュー',exact:true}).click();await page.getByTestId('trip-menu').getByRole('button',{name:'旅行を削除',exact:true}).click();await page.getByTestId('delete-trip-dialog').getByRole('button',{name:'キャンセル',exact:true}).click();await page.getByTestId('delete-trip-dialog').waitFor({state:'hidden'});
                  assert.equal(await page.locator('[data-detail-motion]').count(),0);assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1));assert.deepEqual(errors,[]);
                  fs.writeFileSync(path.join(out,`${engine}-${label}.json`),JSON.stringify(evidence,null,2));console.log(`PASS ${engine}/${label}: status, planner, nested date picker, connections, form/discard, notes persistence, menu/confirmation and cleanup`);
                }catch(e){await page.screenshot({path:path.join(out,`${engine}-${label}-failure.png`)});fs.writeFileSync(path.join(out,'failure.json'),JSON.stringify({engine,label,error:String(e),body:await page.locator('body').innerText(),records:await data()},null,2));throw e;}finally{await context.close();}
              }}finally{await browser.close();}
            }
          })().catch(e=>{console.error(e);process.exitCode=1;}).finally(()=>server.close());
          JS
          node "$RUNNER_TEMP/utility-browser/check.cjs" > /tmp/utility-browser.log 2>&1 || { tail -65 /tmp/utility-browser.log; exit 1; }
          cat /tmp/utility-browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: utility-sheet-browser
          path: |
            /tmp/utility-browser.log
            /tmp/utility-shots
          retention-days: 3
          if-no-files-found: ignore
